name: LivePocket Falench. Notifier

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'キャッシュをクリアして再取得しますか？'
        type: boolean
        default: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 通知済みキャッシュの復元
        if: ${{ inputs.clear_cache != true }}
        uses: actions/cache@v4
        with:
          path: notified_urls.txt
          key: notified-urls-cache-${{ github.run_id }}
          restore-keys: |
            notified-urls-cache-

      - name: スクリプトの実行
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
